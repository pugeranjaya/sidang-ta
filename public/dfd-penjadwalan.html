<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DFD Penjadwalan Sidang TA (Orthogonal Yourdon/DeMarco)</title>
    <style>
        body { 
            background-color: #f8fafc; 
            font-family: 'Arial', sans-serif; 
            margin: 0; 
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        h1 { color: #1e293b; font-size: 24px; margin-bottom: 5px; }
        .badge { 
            background: #e0f2fe; 
            color: #0369a1; 
            padding: 4px 12px; 
            border-radius: 20px; 
            font-size: 13px;
        }
        .dfd-box {
            background: #ffffff;
            border: 1px solid #cbd5e1;
            margin-bottom: 40px;
            overflow-x: auto;
            text-align: center;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
        }
        .dfd-title {
            background: #f1f5f9;
            padding: 10px;
            font-weight: bold;
            font-size: 16px;
            border-bottom: 1px solid #cbd5e1;
            color: #334155;
            text-align: left;
        }
        svg {
            display: inline-block;
            background: white;
        }
        text { font-family: 'Arial', sans-serif; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>DATA FLOW DIAGRAM SISTEM PENJADWALAN SIDANG TA</h1>
            <span class="badge">Notasi Yourdon/DeMarco (Orthogonal Routing) Sesuai Standar Modul APSI</span>
        </div>

        <div class="dfd-box">
            <div class="dfd-title">DATA FLOW DIAGRAM LEVEL 0 (CONTEXT DIAGRAM)</div>
            <svg id="level-0" width="1000" height="500"></svg>
        </div>

        <div class="dfd-box">
            <div class="dfd-title">DATA FLOW DIAGRAM LEVEL 1 (SISTEM UTAMA)</div>
            <svg id="level-1" width="1000" height="880"></svg>
        </div>

        <div class="dfd-box">
            <div class="dfd-title">DATA FLOW DIAGRAM LEVEL 2 (PROSES 4: PENJADWALAN)</div>
            <svg id="level-2" width="1000" height="850"></svg>
        </div>
    </div>

    <script>
    function draw(id, data) {
        const svg = document.getElementById(id);
        let html = `<defs>
            <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#000"/>
            </marker>
        </defs>`;

        // Draw edges
        data.edges.forEach(e => {
            const pts = e.path;
            let d = `M ${pts[0][0]} ${pts[0][1]}`;
            for(let i=1; i<pts.length; i++) {
                d += ` L ${pts[i][0]} ${pts[i][1]}`;
            }
            html += `<path d="${d}" fill="none" stroke="#000" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>`;
            
            // Draw label
            if (e.label) {
                let rot = e.align === 'v' ? '-90' : '0';
                let tx = e.labelPos[0];
                let ty = e.labelPos[1];
                let tw = e.label.length * 6; // slightly tighter background
                
                html += `<g transform="translate(${tx}, ${ty}) rotate(${rot})">
                            <rect x="${-tw/2}" y="-8" width="${tw}" height="16" fill="#ffffff"/>
                            <text x="0" y="4" text-anchor="middle" font-size="10" font-weight="bold" fill="#000">${e.label}</text>
                         </g>`;
            }
        });

        // Draw nodes
        data.nodes.forEach(n => {
            if (n.type === 'process') {
                html += `<circle cx="${n.x}" cy="${n.y}" r="65" fill="#fff" stroke="#000" stroke-width="1.5"/>`;
                
                const lines = n.text.split('\\n');
                html += `<text x="${n.x}" y="${n.y - 35}" text-anchor="middle" font-size="13" font-weight="bold" fill="#000">${lines[0]}</text>`;
                lines.slice(1).forEach((l, i) => {
                    let yOffset = n.y + (i * 14) - ((lines.length - 2) * 7) + 5;
                    html += `<text x="${n.x}" y="${yOffset}" text-anchor="middle" font-size="11" font-weight="bold" fill="#000">${l}</text>`;
                });
            } 
            else if (n.type === 'entity') {
                html += `<rect x="${n.x - 70}" y="${n.y - 25}" width="140" height="50" fill="#fff" stroke="#000" stroke-width="1.5"/>`;
                html += `<text x="${n.x}" y="${n.y + 4}" text-anchor="middle" font-size="11" font-weight="bold" fill="#000">${n.text}</text>`;
            } 
            else if (n.type === 'datastore') {
                html += `<line x1="${n.x - 75}" y1="${n.y - 15}" x2="${n.x + 75}" y2="${n.y - 15}" stroke="#000" stroke-width="1.5"/>`;
                html += `<line x1="${n.x - 75}" y1="${n.y + 15}" x2="${n.x + 75}" y2="${n.y + 15}" stroke="#000" stroke-width="1.5"/>`;
                html += `<text x="${n.x}" y="${n.y + 4}" text-anchor="middle" font-size="11" font-weight="bold" fill="#000">${n.text}</text>`;
            }
        });

        svg.innerHTML = html;
    }

    draw('level-0', {
        nodes: [
            { id: 'Sistem', type: 'process', x: 500, y: 250, text: '0\\nSISTEM INFORMASI\\nPENJADWALAN\\nSIDANG TA' },
            { id: 'Mhs', type: 'entity', x: 150, y: 250, text: 'MAHASISWA' },
            { id: 'Admin', type: 'entity', x: 850, y: 150, text: 'ADMIN' },
            { id: 'Kajur', type: 'entity', x: 850, y: 350, text: 'KAJUR / KAPRODI' }
        ],
        edges: [
            { path: [[220, 230], [442, 230]], label: 'DATA PENDAFTARAN SIDANG', labelPos: [330, 230], align: 'h' },
            { path: [[442, 270], [220, 270]], label: 'INFORMASI JADWAL SIDANG', labelPos: [330, 270], align: 'h' },
            { path: [[780, 150], [530, 150], [530, 191]], label: 'DATA MASTER & PARAMETER JADWAL', labelPos: [655, 150], align: 'h' },
            { path: [[550, 210], [850, 210], [850, 175]], label: 'LAPORAN & NOTIFIKASI JADWAL', labelPos: [700, 210], align: 'h' },
            { path: [[550, 290], [850, 290], [850, 325]], label: 'LAPORAN JADWAL SIDANG', labelPos: [700, 290], align: 'h' }
        ]
    });

    draw('level-1', {
        nodes: [
            { type: 'entity', x: 120, y: 150, text: 'MAHASISWA' },
            { type: 'entity', x: 120, y: 400, text: 'ADMIN' },
            { type: 'entity', x: 120, y: 750, text: 'KAJUR / KAPRODI' },
            
            // Processes (Physically sorted by ID)
            { type: 'process', x: 400, y: 150, text: '1\\nPROSES\\nLOGIN' },
            { type: 'process', x: 400, y: 300, text: '2\\nPROSES MENGELOLA\\nDATA MASTER' },
            { type: 'process', x: 400, y: 450, text: '3\\nPROSES PENDAFTARAN\\nSIDANG' },
            { type: 'process', x: 400, y: 600, text: '4\\nPROSES PENJADWALAN\\nSIDANG' },
            { type: 'process', x: 400, y: 750, text: '5\\nPROSES MENCETAK\\nLAPORAN' },
            
            // Datastores
            { type: 'datastore', x: 700, y: 150, text: 'DATA AKUN' },
            { type: 'datastore', x: 700, y: 250, text: 'DATA MAHASISWA' },
            { type: 'datastore', x: 700, y: 310, text: 'DATA DOSEN' },
            { type: 'datastore', x: 700, y: 370, text: 'DATA JADWAL MENGAJAR' },
            { type: 'datastore', x: 700, y: 450, text: 'DATA PENDAFTARAN' },
            { type: 'datastore', x: 700, y: 600, text: 'DATA JADWAL SIDANG' }
        ],
        edges: [
            // ==========================================
            // LEFT CORRIDOR (BUS ROUTING)
            // ==========================================
            
            // P1 (LOGIN) <-> ENTITIES (Bus lines strictly spaced by 20px)
            { path: [[190, 135], [335, 135]], label: 'DATA LOGIN', labelPos: [262, 135], align: 'h' },
            { path: [[335, 165], [190, 165]], label: 'KONFIRMASI LOGIN', labelPos: [262, 165], align: 'h' },
            
            { path: [[370, 205], [210, 205], [210, 415], [190, 415]], label: 'KONFIRMASI LOGIN', labelPos: [210, 310], align: 'v' },
            { path: [[190, 385], [230, 385], [230, 185], [350, 185]], label: 'DATA LOGIN', labelPos: [230, 285], align: 'v' },
            
            { path: [[190, 735], [250, 735], [250, 195], [355, 195]], label: 'DATA LOGIN', labelPos: [250, 465], align: 'v' },
            { path: [[360, 215], [270, 215], [270, 765], [190, 765]], label: 'KONFIRMASI LOGIN', labelPos: [270, 490], align: 'v' },
            
            // P2 (MASTER) <-> ADMIN
            { path: [[190, 400], [290, 400], [290, 300], [335, 300]], label: 'DATA MASTER', labelPos: [290, 350], align: 'v' },
            
            // P3 (PENDAFTARAN) <-> MHS
            { path: [[190, 175], [310, 175], [310, 430], [335, 430]], label: 'DATA PENDAFTARAN', labelPos: [310, 302], align: 'v' },
            
            // P4 (PENJADWALAN) TRIGGER <-> ADMIN
            { path: [[120, 425], [120, 600], [335, 600]], label: 'PARAMETER JADWAL', labelPos: [290, 600], align: 'h' },

            // P5 (LAPORAN) <-> ENTITIES
            { path: [[335, 750], [190, 750]], label: 'LAPORAN PENGESAHAN', labelPos: [300, 750], align: 'h' },
            { path: [[400, 685], [400, 660], [100, 660], [100, 425]], label: 'LAPORAN JADWAL & NOTIFIKASI', labelPos: [100, 542], align: 'v' },
            { path: [[400, 815], [400, 840], [20, 840], [20, 150], [50, 150]], label: 'INFORMASI JADWAL SIDANG', labelPos: [20, 495], align: 'v' },

            // ==========================================
            // RIGHT CORRIDOR (PROCESS <-> DATASTORE)
            // ==========================================
            
            // P1 <-> D0
            { path: [[465, 135], [625, 135]], label: 'CEK AKUN', labelPos: [545, 135], align: 'h' },
            { path: [[625, 165], [465, 165]], label: 'INFO AKUN', labelPos: [545, 165], align: 'h' },

            // P2 -> D1, D2, D3
            { path: [[441, 250], [625, 250]], label: 'DATA MAHASISWA', labelPos: [533, 250], align: 'h' },
            { path: [[465, 310], [625, 310]], label: 'DATA DOSEN', labelPos: [545, 310], align: 'h' },
            { path: [[441, 350], [550, 350], [550, 370], [625, 370]], label: 'DATA JADWAL MENGAJAR', labelPos: [587, 370], align: 'h' },

            // P3 <-> D4
            { path: [[465, 450], [625, 450]], label: 'DATA PENDAFTARAN', labelPos: [545, 450], align: 'h' },
            { path: [[625, 265], [520, 265], [520, 420], [455, 420]], label: 'INFORMASI DATA MHS', labelPos: [520, 342], align: 'v' },

            // P5 <-> D5
            { path: [[625, 615], [520, 615], [520, 750], [465, 750]], label: 'DATA JADWAL SIDANG', labelPos: [520, 682], align: 'v' },

            // ==========================================
            // RIGHT WRAP-AROUND CORRIDOR (DATASTORE -> P4)
            // ==========================================
            { path: [[775, 450], [820, 450], [820, 540], [440, 540]], label: 'DATA PENDAFTARAN', labelPos: [820, 495], align: 'v' },
            { path: [[775, 250], [850, 250], [850, 560], [450, 560]], label: 'DATA MAHASISWA', labelPos: [850, 405], align: 'v' },
            { path: [[775, 310], [880, 310], [880, 580], [460, 580]], label: 'DATA DOSEN', labelPos: [880, 445], align: 'v' },
            { path: [[465, 600], [625, 600]], label: 'DATA JADWAL SIDANG', labelPos: [545, 600], align: 'h' },
            { path: [[775, 370], [910, 370], [910, 620], [460, 620]], label: 'DATA JADWAL DOSEN', labelPos: [910, 495], align: 'v' }
        ]
    });

    draw('level-2', {
        nodes: [
            { type: 'entity', x: 100, y: 150, text: 'ADMIN' },
            { type: 'process', x: 350, y: 150, text: '4.1\\nPROSES VERIFIKASI\\nPENDAFTAR' },
            { type: 'datastore', x: 650, y: 150, text: 'DATA PENDAFTARAN' },
            
            { type: 'process', x: 350, y: 350, text: '4.2\\nPROSES FILTERING\\nKANDIDAT DOSEN' },
            { type: 'datastore', x: 100, y: 350, text: 'DATA DOSEN' },
            
            { type: 'process', x: 350, y: 550, text: '4.3\\nPROSES HITUNG\\nSKOR AHP' },
            { type: 'datastore', x: 100, y: 550, text: 'DATA MAHASISWA' },
            
            { type: 'process', x: 650, y: 550, text: '4.4\\nPROSES ALOKASI\\nSLOT (HEURISTIC)' },
            { type: 'datastore', x: 650, y: 750, text: 'DATA JADWAL MENGAJAR' },
            { type: 'datastore', x: 880, y: 350, text: 'DATA JADWAL SIDANG' },
            
            { type: 'process', x: 650, y: 350, text: '4.5\\nPROSES SIMPAN\\nJADWAL BARU' }
        ],
        edges: [
            { path: [[170, 150], [285, 150]], label: 'START PENJADWALAN', labelPos: [230, 150], align: 'h' },
            { path: [[575, 150], [415, 150]], label: 'DATA PENDAFTARAN', labelPos: [495, 150], align: 'h' },
            
            { path: [[350, 215], [350, 285]], label: 'DATA PENDAFTAR VALID', labelPos: [350, 250], align: 'v' },
            { path: [[175, 350], [285, 350]], label: 'INFORMASI DATA DOSEN', labelPos: [230, 350], align: 'h' },
            { path: [[880, 365], [880, 440], [450, 440], [450, 350], [415, 350]], label: 'HISTORI BEBAN SIDANG', labelPos: [665, 440], align: 'h' },
            
            { path: [[330, 415], [330, 485]], label: 'DOSEN MEMENUHI SYARAT', labelPos: [330, 450], align: 'v' },
            { path: [[175, 550], [285, 550]], label: 'RUMPUN KEILMUAN MHS', labelPos: [230, 550], align: 'h' },
            
            { path: [[415, 550], [585, 550]], label: 'DAFTAR DOSEN & SKOR AHP', labelPos: [500, 550], align: 'h' },
            { path: [[650, 735], [650, 615]], label: 'DATA JADWAL BENTROK', labelPos: [650, 675], align: 'v' },
            { path: [[880, 365], [880, 530], [715, 530]], label: 'JADWAL SIDANG DOSEN', labelPos: [880, 447], align: 'v' },
            
            { path: [[630, 485], [630, 415]], label: 'KOMBINASI JADWAL TERBAIK', labelPos: [630, 470], align: 'v' },
            { path: [[715, 350], [805, 350]], label: 'JADWAL BARU', labelPos: [760, 350], align: 'h' }
        ]
    });
    </script>
</body>
</html>
