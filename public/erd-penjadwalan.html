<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERD (Chen's Notation) - Penjadwalan Sidang TA Kompleks</title>
    <style>
        body { 
            background-color: #f8fafc; 
            font-family: 'Arial', sans-serif; 
            margin: 0; 
            padding: 40px 20px;
        }
        .container {
            max-width: 1350px;
            margin: 0 auto;
            background: #ffffff;
            border: 1px solid #cbd5e1;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            padding: 30px;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 20px;
        }
        h1 { color: #1e293b; font-size: 24px; margin-bottom: 5px; text-transform: uppercase; }
        .subtitle { color: #64748b; font-size: 14px; }
        .canvas-container {
            display: flex;
            justify-content: center;
            overflow-x: auto;
        }
        svg {
            background: white;
            max-width: 100%;
            height: auto;
        }
        text { font-family: 'Arial', sans-serif; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Entity Relationship Diagram (ERD) Lengkap</h1>
            <div class="subtitle">Notasi Chen (Kompleks 9 Entitas) - Sistem Penjadwalan Sidang Tugas Akhir</div>
        </div>

        <div class="canvas-container">
            <svg id="erd-canvas" viewBox="0 0 1300 900" width="1300" height="900"></svg>
        </div>
    </div>

    <script>
    function renderChenERD() {
        let linesHtml = '';
        let shapesHtml = '';
        let textHtml = '';

        const drawRel = (e1, dia, e2, l1, l2) => {
            linesHtml += `<line x1="${e1.x}" y1="${e1.y}" x2="${dia.x}" y2="${dia.y}" stroke="#000" stroke-width="1.5"/>`;
            linesHtml += `<line x1="${dia.x}" y1="${dia.y}" x2="${e2.x}" y2="${e2.y}" stroke="#000" stroke-width="1.5"/>`;

            let lx1 = e1.x + (dia.x - e1.x) * 0.35;
            let ly1 = e1.y + (dia.y - e1.y) * 0.35;
            shapesHtml += `<circle cx="${lx1}" cy="${ly1}" r="12" fill="#fff" stroke="#fff" stroke-width="2"/>`;
            textHtml += `<text x="${lx1}" y="${ly1+4}" text-anchor="middle" font-size="12" font-weight="bold">${l1}</text>`;

            let lx2 = e2.x + (dia.x - e2.x) * 0.35;
            let ly2 = e2.y + (dia.y - e2.y) * 0.35;
            shapesHtml += `<circle cx="${lx2}" cy="${ly2}" r="12" fill="#fff" stroke="#fff" stroke-width="2"/>`;
            textHtml += `<text x="${lx2}" y="${ly2+4}" text-anchor="middle" font-size="12" font-weight="bold">${l2}</text>`;
        };

        const rect = (x, y, w, h, text) => {
            shapesHtml += `<rect x="${x-w/2}" y="${y-h/2}" width="${w}" height="${h}" fill="#fff" stroke="#000" stroke-width="2"/>`;
            textHtml += `<text x="${x}" y="${y+5}" text-anchor="middle" font-size="13" font-weight="bold">${text}</text>`;
        };

        const diamond = (x, y, w, h, text) => {
            shapesHtml += `<polygon points="${x},${y-h/2} ${x+w/2},${y} ${x},${y+h/2} ${x-w/2},${y}" fill="#fff" stroke="#000" stroke-width="1.5"/>`;
            
            // split text if \n present
            if(text.includes('\\n')) {
                let parts = text.split('\\n');
                textHtml += `<text x="${x}" y="${y-2}" text-anchor="middle" font-size="11" font-weight="bold">${parts[0]}</text>`;
                textHtml += `<text x="${x}" y="${y+10}" text-anchor="middle" font-size="11" font-weight="bold">${parts[1]}</text>`;
            } else {
                textHtml += `<text x="${x}" y="${y+4}" text-anchor="middle" font-size="11" font-weight="bold">${text}</text>`;
            }
        };

        const attr = (cx, cy, angleDeg, dist, text, isPk=false, isFk=false) => {
            let rad = angleDeg * Math.PI / 180;
            let ax = cx + Math.cos(rad) * dist;
            let ay = cy + Math.sin(rad) * dist;
            
            linesHtml += `<line x1="${cx}" y1="${cy}" x2="${ax}" y2="${ay}" stroke="#000" stroke-width="1"/>`;
            
            let labelText = text;
            if (isPk) labelText += ' (PK)';
            if (isFk) labelText += ' (FK)';

            let tw = Math.max(labelText.length * 6.5 + 10, 60);
            let strokeDash = isFk ? 'stroke-dasharray="4 2"' : '';
            
            shapesHtml += `<ellipse cx="${ax}" cy="${ay}" rx="${tw/2}" ry="14" fill="#fff" stroke="#000" stroke-width="1" ${strokeDash}/>`;
            
            if (isPk) {
                textHtml += `<text x="${ax}" y="${ay+4}" text-anchor="middle" font-size="11" text-decoration="underline" font-weight="bold">${labelText}</text>`;
            } else if (isFk) {
                textHtml += `<text x="${ax}" y="${ay+4}" text-anchor="middle" font-size="11" font-style="italic">${labelText}</text>`;
            } else {
                textHtml += `<text x="${ax}" y="${ay+4}" text-anchor="middle" font-size="11">${labelText}</text>`;
            }
        };

        // ENTITIES
        const RMP = {x: 200, y: 150, label: 'RUMPUN_ILMU'};
        const ADM = {x: 800, y: 150, label: 'ADMIN'};
        const DOS = {x: 500, y: 250, label: 'DOSEN'};
        const MHS = {x: 200, y: 450, label: 'MAHASISWA'};
        const JDW = {x: 800, y: 450, label: 'JADWAL_MENGAJAR'};
        const SDG = {x: 500, y: 650, label: 'SIDANG'};
        const MK  = {x: 1100, y: 450, label: 'MATA_KULIAH'};
        const RNG = {x: 800, y: 650, label: 'RUANGAN'};
        const PRD = {x: 200, y: 650, label: 'PERIODE_AKD'};

        // RELATIONSHIPS (Diamonds)
        const D_RMP_MHS = {x: 200, y: 300, label: 'MASUK\\nRUMPUN'};
        const D_RMP_DOS = {x: 350, y: 200, label: 'AHLI\\nRUMPUN'};
        const D_ADM_DOS = {x: 650, y: 200, label: 'MENGELOLA'};
        const D_DOS_MHS = {x: 350, y: 350, label: 'MEMBIMBING'};
        const D_DOS_JDW = {x: 650, y: 350, label: 'MEMILIKI'};
        const D_DOS_SDG = {x: 500, y: 450, label: 'MENGUJI'};
        const D_MHS_SDG = {x: 350, y: 550, label: 'MELAKSANAKAN'};
        const D_RNG_SDG = {x: 650, y: 650, label: 'RUANG\\nSIDANG'};
        const D_RNG_JDW = {x: 800, y: 550, label: 'RUANG\\nKULIAH'};
        const D_PRD_SDG = {x: 350, y: 650, label: 'DILAKSANAKAN\\nPADA'};
        const D_MK_JDW  = {x: 950, y: 450, label: 'MENGAMBIL\\nMK'};

        // DRAW RELATIONSHIP LINES
        drawRel(RMP, D_RMP_MHS, MHS, '1', 'N');
        drawRel(RMP, D_RMP_DOS, DOS, 'N', 'M');
        drawRel(ADM, D_ADM_DOS, DOS, '1', 'N');
        drawRel(DOS, D_DOS_MHS, MHS, '1', 'N');
        drawRel(DOS, D_DOS_JDW, JDW, '1', 'N');
        drawRel(DOS, D_DOS_SDG, SDG, 'N', 'M');
        drawRel(MHS, D_MHS_SDG, SDG, '1', '1');
        drawRel(RNG, D_RNG_SDG, SDG, '1', 'N');
        drawRel(RNG, D_RNG_JDW, JDW, '1', 'N');
        drawRel(PRD, D_PRD_SDG, SDG, '1', 'N');
        drawRel(MK,  D_MK_JDW,  JDW, '1', 'N');

        // DRAW ATTRIBUTES
        // 1. RUMPUN_ILMU
        attr(RMP.x, RMP.y, 225, 90, 'id', true);
        attr(RMP.x, RMP.y, 135, 90, 'nama_rumpun');

        // 2. ADMIN
        attr(ADM.x, ADM.y, 315, 90, 'id', true);
        attr(ADM.x, ADM.y, 0,   90, 'username');
        attr(ADM.x, ADM.y, 45,  90, 'password');
        attr(ADM.x, ADM.y, 90,  90, 'nama_admin');

        // 3. DOSEN
        attr(DOS.x, DOS.y, 270, 110, 'id', true);
        attr(DOS.x, DOS.y, 240, 110, 'nip');
        attr(DOS.x, DOS.y, 300, 110, 'nama');
        attr(DOS.x, DOS.y, 0,   110, 'rumpun_id', false, true);

        // 4. MAHASISWA
        attr(MHS.x, MHS.y, 180, 110, 'id', true);
        attr(MHS.x, MHS.y, 225, 110, 'nim');
        attr(MHS.x, MHS.y, 135, 110, 'nama');
        attr(MHS.x, MHS.y, 90,  110, 'judul_ta');
        attr(MHS.x, MHS.y, 155, 110, 'pembimbing_id', false, true);
        attr(MHS.x, MHS.y, 205, 110, 'rumpun_id', false, true);

        // 5. JADWAL_MENGAJAR
        attr(JDW.x, JDW.y, 270, 110, 'id', true);
        attr(JDW.x, JDW.y, 240, 110, 'dosen_id', false, true);
        attr(JDW.x, JDW.y, 210, 110, 'mk_id', false, true);
        attr(JDW.x, JDW.y, 180, 110, 'ruangan_id', false, true);
        attr(JDW.x, JDW.y, 150, 110, 'hari');
        attr(JDW.x, JDW.y, 120, 110, 'jam_mulai');
        attr(JDW.x, JDW.y, 315, 110, 'jam_selesai');
        attr(JDW.x, JDW.y, 340, 110, 'tahun_id', false, true);

        // 6. SIDANG
        attr(SDG.x, SDG.y, 20,  130, 'id', true);
        attr(SDG.x, SDG.y, 40,  130, 'ruangan_id', false, true);
        attr(SDG.x, SDG.y, 60,  130, 'jam_selesai');
        attr(SDG.x, SDG.y, 80,  130, 'jam_mulai');
        attr(SDG.x, SDG.y, 100, 130, 'tanggal');
        attr(SDG.x, SDG.y, 120, 130, 'mahasiswa_id', false, true);
        attr(SDG.x, SDG.y, 140, 130, 'status');
        attr(SDG.x, SDG.y, 160, 130, 'jenis_sidang');

        // 7. MATA_KULIAH
        attr(MK.x, MK.y, 45,  90, 'id', true);
        attr(MK.x, MK.y, 0,   90, 'kode_mk');
        attr(MK.x, MK.y, 315, 90, 'nama_mk');
        attr(MK.x, MK.y, 270, 90, 'sks');
        attr(MK.x, MK.y, 90,  90, 'semester');

        // 8. RUANGAN
        attr(RNG.x, RNG.y, 45,  90, 'id', true);
        attr(RNG.x, RNG.y, 0,   90, 'nama_ruang');
        attr(RNG.x, RNG.y, 90,  90, 'kapasitas');
        attr(RNG.x, RNG.y, 135, 90, 'lokasi');

        // 9. PERIODE_AKADEMIK
        attr(PRD.x, PRD.y, 225, 90, 'id', true);
        attr(PRD.x, PRD.y, 180, 90, 'tahun');
        attr(PRD.x, PRD.y, 135, 90, 'semester');
        attr(PRD.x, PRD.y, 90,  90, 'status');


        // DRAW SHAPES (Diamonds)
        diamond(D_RMP_MHS.x, D_RMP_MHS.y, 90, 45, D_RMP_MHS.label);
        diamond(D_RMP_DOS.x, D_RMP_DOS.y, 90, 45, D_RMP_DOS.label);
        diamond(D_ADM_DOS.x, D_ADM_DOS.y, 110, 45, D_ADM_DOS.label);
        diamond(D_DOS_MHS.x, D_DOS_MHS.y, 110, 45, D_DOS_MHS.label);
        diamond(D_DOS_JDW.x, D_DOS_JDW.y, 90, 45, D_DOS_JDW.label);
        diamond(D_DOS_SDG.x, D_DOS_SDG.y, 90, 45, D_DOS_SDG.label);
        diamond(D_MHS_SDG.x, D_MHS_SDG.y, 120, 45, D_MHS_SDG.label);
        diamond(D_RNG_SDG.x, D_RNG_SDG.y, 90, 45, D_RNG_SDG.label);
        diamond(D_RNG_JDW.x, D_RNG_JDW.y, 90, 45, D_RNG_JDW.label);
        diamond(D_PRD_SDG.x, D_PRD_SDG.y, 130, 45, D_PRD_SDG.label);
        diamond(D_MK_JDW.x,  D_MK_JDW.y,  100, 45, D_MK_JDW.label);

        // DRAW SHAPES (Entities)
        rect(RMP.x, RMP.y, 130, 40, RMP.label);
        rect(ADM.x, ADM.y, 100, 40, ADM.label);
        rect(DOS.x, DOS.y, 110, 40, DOS.label);
        rect(MHS.x, MHS.y, 110, 40, MHS.label);
        rect(JDW.x, JDW.y, 160, 40, JDW.label);
        rect(SDG.x, SDG.y, 110, 40, SDG.label);
        rect(MK.x,  MK.y,  130, 40, MK.label);
        rect(RNG.x, RNG.y, 100, 40, RNG.label);
        rect(PRD.x, PRD.y, 130, 40, PRD.label);

        // Render into SVG
        document.getElementById('erd-canvas').innerHTML = linesHtml + shapesHtml + textHtml;
    }

    // Execute
    renderChenERD();
    </script>
</body>
</html>
