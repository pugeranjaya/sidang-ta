[phases.setup]
aptPkgs = ["libicu-dev"]
cmds = ["docker-php-ext-install intl"]

[phases.install]
cmds = [
    "composer install --optimize-autoloader --no-dev",
    "npm install"
]

[phases.build]
cmds = [
    "rm -f bootstrap/cache/*.php",
    "npm run build",
    "php artisan package:discover --ansi",
    "php artisan storage:link --force"
]

[start]
cmd = "rm -f bootstrap/cache/*.php && php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=$PORT"
